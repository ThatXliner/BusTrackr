<!doctype html><html><head><meta charset="utf-8"><title>Valley bus model inspection</title><style>body{margin:0;background:#141f27}canvas{display:block}p{position:absolute;top:20px;left:30px;color:#fff;font:13px system-ui}</style></head><body><p>Procedural school bus · 1:1 scale · drag to inspect</p><script type="module">
import * as T from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
const r=new T.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,1.5));r.toneMapping=T.ACESFilmicToneMapping;r.toneMappingExposure=1;r.shadowMap.enabled=true;r.shadowMap.type=T.PCFSoftShadowMap;document.body.appendChild(r.domElement);const s=new T.Scene();s.background=new T.Color('#263944');s.environment=new T.PMREMGenerator(r).fromScene(new RoomEnvironment(),.04).texture;const c=new T.PerspectiveCamera(38,innerWidth/innerHeight,.1,100);c.position.set(13,7,16);const o=new OrbitControls(c,r.domElement);o.target.set(0,1.5,0);o.update();s.add(new T.HemisphereLight('#fff8e0','#344a58',2));const l=new T.DirectionalLight('#fff0d2',3);l.position.set(8,12,5);l.castShadow=true;l.shadow.mapSize.set(2048,2048);l.shadow.camera.left=-15;l.shadow.camera.right=15;l.shadow.camera.top=15;l.shadow.camera.bottom=-15;l.shadow.normalBias=.015;s.add(l);const p=new T.Mesh(new T.PlaneGeometry(100,100),new T.MeshStandardMaterial({color:'#354753',roughness:1}));p.rotation.x=-Math.PI/2;p.receiveShadow=true;s.add(p);new GLTFLoader().load('/models/valley-bus.glb',g=>{g.scene.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});s.add(g.scene);window.modelReady=true;});r.setAnimationLoop(()=>{o.update();r.render(s,c)});
</script></body></html>
